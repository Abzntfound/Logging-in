<!DOCTYPE html>
<html>
<head>
    <title>A&M Hair and Beauty - Login</title>

    <link rel="icon" href="A&M.ico">
    <link rel="stylesheet" href="https://auth.amhairandbeauty.com/auth-style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { margin:0; font-family: sans-serif; background:#f0eee9; }
        #header a { text-decoration:none; color:inherit; }
        #basket-header { cursor:pointer; }
    </style>
</head>

<body>

<!-- HEADER (FIXED HYPERLINKS) -->
<div id="header">
    
    <!-- HOME LINK RESTORED -->
    <a href="https://www.amhairandbeauty.com" class="left" id="header-logo">
        <h1>A&M Hair and Beauty</h1>
    </a>

    <div class="logo" id="header-logo-img">
        <a href="https://www.amhairandbeauty.com">
            <img src="A&M.png" alt="A&M Logo">
        </a>
    </div>

    <!-- BASKET LINK RESTORED -->
    <a href="https://www.amhairandbeauty.com/cart" id="basket-header">
        <img src="basket.png" alt="Basket">
        <span>Basket</span>
    </a>

</div>

<!-- MAIN -->
<div id="auth-container">
    <form id="login-form">
        <input id="login-email" type="email" placeholder="Email">
        <input id="login-password" type="password" placeholder="Password">
        <button type="submit">Login</button>
    </form>

    <form id="signup-form" style="display:none;">
        <input id="signup-name" placeholder="Name">
        <input id="signup-email" type="email" placeholder="Email">
        <input id="signup-password" type="password" placeholder="Password">
        <button type="submit">Signup</button>
    </form>

    <button onclick="switchToSignup()">Go Signup</button>
    <button onclick="switchToLogin()">Go Login</button>

    <div id="auth-message"></div>
</div>

<div id="user-profile" style="display:none;">
    <h2>Welcome <span id="user-name-display"></span></h2>
    <p id="user-email-display"></p>
    <button id="logout-btn">Logout</button>
</div>
