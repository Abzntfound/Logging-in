<!DOCTYPE html>
<html>
<head>
    <title>A&M Admin Dashboard</title>
    <link rel="icon" href="https://amhairandbeauty.com/A&M.ico">

    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td, th {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        .ban {
            background: #e74c3c;
            color: white;
            border: none;
        }

        .unban {
            background: #2ecc71;
            color: white;
            border: none;
        }

        .error { color: red; }
    </style>
</head>

<body>

<div class="box">
    <h1>Admin Dashboard</h1>
    <div id="status">Loading...</div>

    <table id="usersTable" style="display:none">
        <thead>
            <tr>
                <th>Email</th>
                <th>User ID</th>
                <th>Status</th>
                <th>Actions</th>
                <th>Parcel</th>
            </tr>
        </thead>
        <tbody id="users"></tbody>
    </table>
    <h2>Reviews</h2>
    <div id="reviews"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
if (!window.__amAdminLoaded) {
window.__amAdminLoaded = true;

const SUPABASE_URL = "https://bipejrjipvoqvkwuzftz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpcGVqcmppcHZvcXZrd3V6ZnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzYzMjMsImV4cCI6MjA5NzIxMjMyM30.Z8V7chc-UOK2UU5dxBydgLbT0u1DUv2_DGtisLmZWq4";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_EMAILS = [
    "adube6113@outlook.com"
];

async function adminLoad() {
    const { data: { user } } = await supabase.auth.getUser();

    if (!user) {
        window.location.href = "/";
        return;
    }

    if (!ADMIN_EMAILS.includes(user.email)) {
        document.body.innerHTML = "<h1>❌ Access Denied</h1>";
        return;
    }

    document.getElementById("status").innerHTML = `<h2>Welcome Admin ${user.email}</h2>`;

    loadUsers();
    loadReviews();
}

async function loadUsers() {
    const { data: users, error } = await supabase.from("profiles").select("*");
    if (error) { console.error(error); return; }

    const tbody = document.getElementById("users");
    tbody.innerHTML = users.map(u => `
        <tr>
            <td>${u.email || "No email"}</td>
            <td>${u.id}</td>
            <td>${u.role || "user"}</td>
            <td><button onclick="banUser('${u.id}')">Ban</button></td>
        </tr>
    `).join("");

    document.getElementById("usersTable").style.display = "table";
}

async function banUser(userId) {
    if (!confirm("Ban this user?")) return;
    const { error } = await supabase.from("profiles").update({ role: "banned" }).eq("id", userId);
    if (error) { alert("Failed to ban user"); return; }
    loadUsers();
}

async function loadReviews() {
    const container = document.getElementById("reviews");
    const { data: reviews, error } = await supabase.from("reviews").select("*").order("created_at", { ascending: false });

    if (error) {
        container.innerHTML = "<p style='color:red'>Error loading reviews</p>";
        return;
    }

    container.innerHTML = reviews.map(r => `
        <div style="padding:10px;border-bottom:1px solid #ddd">
            <b>${r.user_email || "Unknown"}</b><br/>
            ${r.content}<br/>
            <small>${new Date(r.created_at).toLocaleString()}</small>
            <br/><br/>
            <button onclick="deleteReview('${r.id}')">Delete</button>
        </div>
    `).join("");
}

async function deleteReview(id) {
    if (!confirm("Delete this review?")) return;
    const { error } = await supabase.from("reviews").delete().eq("id", id);
    if (error) { alert("Failed to delete"); return; }
    loadReviews();
}

window.addEventListener("DOMContentLoaded", adminLoad);

} // end __amAdminLoaded guard
</script>
</body>
</html>
