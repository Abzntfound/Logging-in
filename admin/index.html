<!DOCTYPE html>
<html>
<head>
    <title>A&M Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td, th {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        .ban {
            background: #e74c3c;
            color: white;
            border: none;
        }

        .unban {
            background: #2ecc71;
            color: white;
            border: none;
        }

        .error { color: red; }
    </style>
</head>

<body>

<div class="box">
    <h1>Admin Dashboard</h1>
    <div id="status">Loading...</div>

    <table id="usersTable" style="display:none">
        <thead>
            <tr>
                <th>Email</th>
                <th>User ID</th>
                <th>Status</th>
                <th>Actions</th>
                <th>Parcel</th>
            </tr>
        </thead>
        <tbody id="users"></tbody>
    </table>
    <h2>Reviews</h2>
    <div id="reviews"></div>
</div>

<script src="/auth.js"></script>

<script>

const ADMIN_EMAILS = [
    "adube6113@outlook.com"
];

const supabase = window.supabaseClient;

async function adminLoad() {

    const { data: { user } } = await supabase.auth.getUser();

    if (!user) {
        window.location.href = "/";
        return;
    }

    if (!ADMIN_EMAILS.includes(user.email)) {
        document.body.innerHTML = "<h1>❌ Access Denied</h1>";
        return;
    }

    loadUsers();
    loadReviews(); // ✅ NEW
}

// ================= USERS =================
async function loadUsers() {

    const { data: users } = await supabase
        .from("profiles")
        .select("*");

    const tbody = document.getElementById("users");

    tbody.innerHTML = users.map(u => `
        <tr>
            <td>${u.email}</td>
            <td>${u.id}</td>
        </tr>
    `).join("");
}

// ================= REVIEWS =================
async function loadReviews() {

    const container = document.getElementById("reviews");

    const { data: reviews, error } = await supabase
        .from("reviews")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        container.innerHTML = `<p style="color:red;">Error loading reviews</p>`;
        return;
    }

    container.innerHTML = reviews.map(r => `
        <div style="
            padding:10px;
            border-bottom:1px solid #ddd;
            margin-bottom:10px;
        ">
            <b>${r.user_email || "Unknown user"}</b><br/>
            ${r.content}<br/>
            <small>${new Date(r.created_at).toLocaleString()}</small>

            <br/><br/>

            <button onclick="deleteReview('${r.id}')"
                style="background:#e74c3c;color:white;border:none;padding:5px 10px;">
                Delete
            </button>
        </div>
    `).join("");
}

// ================= DELETE REVIEW =================
async function deleteReview(id) {

    const confirmDelete = confirm("Delete this review?");
    if (!confirmDelete) return;

    const { error } = await supabase
        .from("reviews")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Failed to delete review");
        return;
    }

    loadReviews(); // refresh
}

window.addEventListener("DOMContentLoaded", adminLoad);

</script>
</body>
</html>
