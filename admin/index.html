<!DOCTYPE html>
<html>

<head>

<title>A&M Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    margin:0;
    padding:40px;
    font-family:Arial, sans-serif;
    background:#f0eee9;
}


.container {

    background:white;
    border-radius:20px;
    padding:30px;
    max-width:900px;
    margin:auto;

    box-shadow:
    0 20px 50px rgba(0,0,0,.15);

}


h1 {
    color:#1a1a2e;
}


#status {

    padding:10px;
    margin-bottom:20px;

}


.user {

    background:#f8f7f5;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;

}


button {

    background:#1a1a2e;
    color:white;
    border:none;

    padding:12px 20px;
    border-radius:10px;

    cursor:pointer;

}


</style>

</head>


<body>


<div class="container">


<h1>
🛠️ Admin Dashboard
</h1>


<div id="status">
Loading content...
</div>


<button onclick="location.href='/'">
← Back
</button>


<hr>


<h2>
Users
</h2>


<div id="users">
</div>


</div>



<script>


/*
================================
SUPABASE
================================
*/


const SUPABASE_URL =
"https://bipejrjipvoqvkwuzftz.supabase.co";


const SUPABASE_KEY =
"YOUR_SUPABASE_ANON_KEY";



const adminClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);




/*
================================
CHECK ADMIN
================================
*/


async function checkAdmin(){


const {
    data:{
        user
    }
}
=
await adminClient.auth.getUser();



if(!user){

window.location.href="/";

return;

}




const {

data:profile,
error

}
=
await adminClient

.from("profiles")

.select("*")

.eq("id",user.id)

.single();




if(error){

document.getElementById("status")
.innerHTML =
"❌ Profile error";


console.error(error);

return;

}




if(profile.role !== "admin"){


document.body.innerHTML =
`

<h1>
❌ Access denied
</h1>

`;


return;


}



document.getElementById("status")
.innerHTML =
`

✅ Logged in as admin:
${user.email}

`;



loadUsers();


}





/*
================================
LOAD USERS
================================
*/


async function loadUsers(){



const {

data,
error

}

=
await adminClient

.from("profiles")

.select("*");





if(error){


document.getElementById("users")
.innerHTML =
error.message;


return;


}




document.getElementById("users")

.innerHTML = data.map(user =>


`

<div class="user">


<b>
${user.name || "No name"}
</b>


<br>


${user.email}


<br>


Role:
${user.role || "user"}


</div>


`

).join("");



}




checkAdmin();


</script>


</body>

</html>
