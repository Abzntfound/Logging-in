<!DOCTYPE html>
<html>
<head>
    <title>A&M Admin Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td, th {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Admin Dashboard</h1>

    <div id="status">Loading...</div>

    <table id="usersTable" style="display:none">
        <thead>
            <tr>
                <th>Email</th>
                <th>ID</th>
            </tr>
        </thead>

        <tbody id="users"></tbody>
    </table>
</div>

<script src="/auth.js"></script>

<script>

const ADMIN_EMAILS = [
    "adube6113@outlook.com"
];

async function adminLoad() {

    const supabase = window.supabaseClient;

    if (!supabase) {
        document.getElementById("status").innerHTML =
            `<p class="error">Supabase client missing.</p>`;
        return;
    }

    // Get logged in user
    const { data: { user } } = await supabase.auth.getUser();

    if (!user) {
        window.location.href = "/";
        return;
    }

    // ✅ EMAIL-BASED ADMIN CHECK (FIX)
    if (!ADMIN_EMAILS.includes(user.email)) {
        document.body.innerHTML = "<h1>❌ Access Denied</h1>";
        return;
    }

    // Load profiles
    const { data: users, error } = await supabase
        .from("profiles")
        .select("*");

    if (error) {
        console.error(error);
        document.getElementById("status").innerHTML =
            `<p class="error">Error loading users</p>`;
        return;
    }

    document.getElementById("status").innerHTML =
        `<h2>Welcome Admin ${user.email}</h2>`;

    const table = document.getElementById("usersTable");
    const tbody = document.getElementById("users");

    table.style.display = "table";

    tbody.innerHTML = users.map(u => `
        <tr>
            <td>${u.email || "No email"}</td>
            <td>${u.id}</td>
        </tr>
    `).join("");
}

window.addEventListener("DOMContentLoaded", adminLoad);

</script>

</body>
</html>
