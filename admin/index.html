<!DOCTYPE html>
<html>
<head>
    <title>A&M Hair & Beauty - Admin Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f0eee9;
            min-height: 100vh;
            padding: 40px;
        }


        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }


        h1 {
            margin-bottom: 20px;
            color: #1a1a2e;
        }


        h2 {
            margin: 25px 0 15px;
            color: #333;
        }


        button {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }


        button:hover {
            opacity: .8;
        }


        .user {
            background: #f8f7f5;
            border: 1px solid #e0ddd8;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }


        .user strong {
            color: #1a1a2e;
        }


        .error {
            color: #c0392b;
            background: #fff0ee;
            padding: 15px;
            border-radius: 10px;
        }


        .success {
            color: green;
        }


        #logout {
            margin-top: 20px;
            background: #c0392b;
        }


        .loading {
            color: #777;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        A&M Admin Dashboard
    </h1>


    <div id="content" class="loading">
        Loading dashboard...
    </div>


    <button id="logout">
        Logout
    </button>


</div>




<script>


// ================================
// SUPABASE SETUP
// ================================


const SUPABASE_URL =
"https://bipejrjipvoqvkwuzftz.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpcGVqcmppcHZvcXZrd3V6ZnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzYzMjMsImV4cCI6MjA5NzIxMjMyM30.Z8V7chc-UOK2UU5dxBydgLbT0u1DUv2_DGtisLmZWq4";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);




// ================================
// DASHBOARD LOADER
// ================================


async function loadAdminDashboard() {


    const content =
    document.getElementById("content");



    // Get logged in user

    const {
        data: {
            user
        },
        error: userError

    } = await supabase.auth.getUser();



    if (userError || !user) {

        window.location.href = "/";
        return;

    }




    // Get profile


    const {
        data: profile,
        error: profileError

    } = await supabase

        .from("profiles")

        .select("*")

        .eq(
            "id",
            user.id
        )

        .single();




    if (profileError || !profile) {


        content.innerHTML = `

        <div class="error">

        ❌ Profile does not exist.

        </div>

        `;

        return;

    }





    // Check admin permission


    if(profile.role !== "admin") {


        content.innerHTML = `

        <div class="error">

        ❌ Access denied.<br>
        Your role is:
        ${profile.role || "none"}

        </div>

        `;


        return;

    }




    // Load all users


    const {

        data: users,

        error: usersError


    } = await supabase

        .from("profiles")

        .select("*")

        .order(
            "created_at",
            {
                ascending:false
            }
        );




    if(usersError) {


        content.innerHTML = `

        <div class="error">

        ${usersError.message}

        </div>

        `;


        return;

    }




    // Display users


    content.innerHTML = `

        <p class="success">
            ✅ Admin verified
        </p>


        <h2>
            Users (${users.length})
        </h2>


        ${
            users.map(user => `


            <div class="user">


                <strong>
                ${user.name || "Unnamed User"}
                </strong>


                <br>


                Email:
                ${user.email || "No email"}


                <br>


                Role:
                ${user.role || "user"}


                <br>


                ID:
                ${user.id}


            </div>


            `).join("")
        }


    `;


}




// ================================
// LOGOUT
// ================================


document
.getElementById("logout")
.addEventListener(
"click",
async () => {

    await supabase.auth.signOut();

    window.location.href="/";

});




// Start

loadAdminDashboard();



</script>


</body>
</html>
